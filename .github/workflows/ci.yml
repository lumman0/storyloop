name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HARNESS_VERSION: "0.1.0"
  PYTHONPATH: ""
  PYTHONIOENCODING: utf-8
  STORY_BAILIAN_API_KEY: offline-test
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.25
      - name: Install locked harness dependencies only
        run: |
          uv export --locked --package storyloop-harness --extra test --no-emit-workspace -o harness-requirements.txt
          python -m pip install -r harness-requirements.txt
      - name: Build and install the independent harness wheel
        run: |
          uv build --no-sources --wheel packages/harness --out-dir dist/harness
          python -m pip install --no-deps --no-index --find-links dist/harness "storyloop-harness==${HARNESS_VERSION}"
      - name: Harness tests and import boundary
        run: python -I -m pytest packages/harness/tests -q --junitxml=harness-results.xml
      - name: Offline example outside the checkout
        run: |
          cp -R packages/harness/examples "$RUNNER_TEMP/harness-example"
          cd "$RUNNER_TEMP/harness-example"
          python -I offline_turn.py
      - uses: actions/upload-artifact@v4
        with:
          name: harness-wheel
          path: dist/harness/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-results
          path: harness-results.xml

  platform:
    needs: harness
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.25
      - uses: actions/download-artifact@v4
        with:
          name: harness-wheel
          path: dist/harness
      - name: Install locked platform dependencies without workspace packages
        run: |
          uv export --locked --all-extras --no-emit-workspace -o platform-requirements.txt
          python -m pip install -r platform-requirements.txt
      - name: Consume pinned harness artifact and build platform independently
        run: |
          python -m pip install --no-deps --no-index --find-links dist/harness "storyloop-harness==${HARNESS_VERSION}"
          uv build --no-sources --wheel packages/platform --out-dir dist/platform
          python -m pip install --no-deps --no-index --find-links dist/platform storyloop-platform==0.1.0
          python -m pip check
      - name: Installed artifact integration outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/platform-smoke"
          cp tests/wheel_smoke.py "$RUNNER_TEMP/platform-smoke/smoke.py"
          cp -R examples/freeform "$RUNNER_TEMP/platform-smoke/scenario"
          cd "$RUNNER_TEMP/platform-smoke"
          python -I smoke.py
      - name: Backend integration and package boundaries
        run: python -I -m pytest tests -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.os }}
          path: test-results.xml
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/platform/web/package-lock.json
      - name: Frontend tests and build
        if: runner.os == 'Linux'
        working-directory: packages/platform/web
        run: |
          npm ci
          npm test
          npm run build
      - name: Browser interactions
        if: runner.os == 'Linux'
        working-directory: packages/platform/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: browser-failures
          path: packages/platform/web/test-results/
