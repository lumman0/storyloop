[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-harness"
version = "0.1.0"
description = "Causal runtime for interactive story agents"
requires-python = ">=3.12"
dependencies = ["storyloop-platform>=0.1,<0.2"]

[project.optional-dependencies]
agents = ["storyloop-platform[agents]>=0.1,<0.2"]
observability = ["storyloop-platform[observability]>=0.1,<0.2"]
portal = ["storyloop-platform[portal]>=0.1,<0.2"]
online = ["storyloop-platform[online]>=0.1,<0.2"]
player-memory = ["storyloop-platform[player-memory]>=0.1,<0.2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
story_harness = ["defaults/*.json", "migrations/*.py", "migrations/versions/*.py"]

[tool.uv.sources]
storyloop-harness = { workspace = true }
storyloop-platform = { workspace = true }

[tool.uv.workspace]
members = ["packages/harness", "packages/platform"]
