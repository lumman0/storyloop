[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-harness"
version = "0.1.0"
description = "Causal runtime for interactive story agents"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
agents = [
  "agentscope==1.0.21",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "mcp==1.30.0",
  "tqdm==4.70.1",
]
observability = [
  "langfuse>=4.8.1,<5",
]
portal = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "pywin32>=306; sys_platform == 'win32'",
]
online = [
  "psycopg[binary]>=3.1,<4",
]
player-memory = [
  "mem0ai==2.2.1",
]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
story_harness = ["defaults/*.json", "migrations/*.py", "migrations/versions/*.py"]
