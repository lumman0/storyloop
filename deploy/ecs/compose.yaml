x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *json-logging
    environment:
      POSTGRES_DB: story
      POSTGRES_USER: story
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${STORY_DATA_DIR:?Set STORY_DATA_DIR to a persistent data directory}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d story"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build:
      context: ../..
      dockerfile: deploy/ecs/Dockerfile.api
    restart: unless-stopped
    logging: *json-logging
    environment:
      DATABASE_URL: postgresql+psycopg://story:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/story
      STORY_BAILIAN_API_KEY: ${STORY_BAILIAN_API_KEY:?Set a pay-as-you-go Model Studio API key in .env}
      STORY_BAILIAN_BASE_URL: ${STORY_BAILIAN_BASE_URL:-}
      STORY_ALLOWED_HOSTS: ${STORY_ALLOWED_HOSTS:?Set the public IP or domain in .env}
      STORY_ALLOWED_ORIGINS: ${STORY_ALLOWED_ORIGINS:?Set the browser origin in .env}
      STORY_CATALOG: /app/private/catalog.json
      STORY_UPLOAD_DIR: /app/uploads
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      STORY_TRACE_CONTENT: ${STORY_TRACE_CONTENT:-0}
    volumes:
      - ${STORY_PRIVATE_DIR:?Set STORY_PRIVATE_DIR to the private scenario directory}:/app/private:ro
      - ${STORY_DATA_DIR:?Set STORY_DATA_DIR to a persistent data directory}/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [backend]

  web:
    build:
      context: ../..
      dockerfile: deploy/ecs/Dockerfile.web
    restart: unless-stopped
    logging: *json-logging
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
