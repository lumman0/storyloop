limit_req_zone $binary_remote_addr zone=story_auth:10m rate=10r/m;
map $request_method $story_save_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $story_save_limit_key zone=story_saves:10m rate=12r/m;
limit_req_zone $story_save_limit_key zone=story_uploads:10m rate=3r/m;

server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/storyloop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storyloop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    limit_req_status 429;
    client_max_body_size 5m;

    location ~ ^/v1/(accounts|sessions)$ {
        limit_req zone=story_auth burst=5 nodelay;
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/saves {
        limit_req zone=story_saves burst=5 nodelay;
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/my-scenarios {
        limit_req zone=story_uploads burst=2 nodelay;
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://api:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://api:8765;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
