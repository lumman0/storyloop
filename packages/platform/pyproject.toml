[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyloop-platform"
version = "0.1.0"
description = "Player and creator platform for StoryLoop"
requires-python = ">=3.12"
dependencies = [
  "storyloop-harness>=0.1,<0.2",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
agents = [
  "agentscope==2.0.9",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "mcp==1.30.0",
  "tqdm==4.70.1",
]
observability = [
  "langfuse>=4.8.1,<5",
]
portal = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "pywin32>=306; sys_platform == 'win32'",
]
online = [
  "psycopg[binary]>=3.1,<4",
]
player-memory = [
  "mem0ai==2.2.1",
]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storyloop_platform = ["migrations/*.py", "migrations/versions/*.py"]

[tool.uv.sources]
storyloop-harness = { workspace = true }
